<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef6ff">
<title>シャドバWB 新弾カードまとめ</title>
<style>
:root{--bg:#f5f9ff;--panel:#fff;--soft:#f8fbff;--line:#d7e4f3;--line2:#c6d7ea;--text:#243246;--muted:#6d7c91;--accent:#4c88c7;--accentSoft:#e6f1ff;--gold:#c9972c;--shadow:0 10px 28px rgba(74,110,153,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f8fbff 0%,#f1f7fd 100%);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.7}.wrap{max-width:1360px;margin:auto;padding:26px 24px 80px}.hero{padding:28px 8px 18px}.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.08em}h1{margin:8px 0 10px;font-size:clamp(32px,4.4vw,48px);line-height:1.2;letter-spacing:.01em}.subtitle{margin:0;max-width:860px;color:var(--muted);font-size:17px}.controls{position:sticky;top:0;z-index:20;background:rgba(245,249,255,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.controls-inner{max-width:1360px;margin:auto;padding:14px 24px;display:flex;gap:10px;overflow:auto;scrollbar-width:none}.controls-inner::-webkit-scrollbar{display:none}button.filter{flex:0 0 auto;border:1px solid var(--line2);background:#fff;color:#4d6078;padding:10px 15px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}button.filter.active{background:#dfeeff;color:#285d93;border-color:#c4ddfb}.section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:30px 0 14px}.section-title h2{margin:0;font-size:26px;line-height:1.25}.section-title small,.rotation-note{color:var(--muted);font-size:14px}.rotation-note{margin:5px 0 0}.toolbar{display:flex;gap:12px;margin:8px 0 18px}.search{flex:1;min-width:0;background:#fff;border:1px solid var(--line2);border-radius:14px;padding:13px 15px;color:var(--text);outline:none;font-size:15px}.search:focus,select:focus{border-color:#9ec4ee;box-shadow:0 0 0 3px rgba(122,173,226,.14)}select{background:#fff;color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:0 14px;font-weight:700;font-size:15px;min-width:140px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{position:relative;display:grid;grid-template-columns:170px 1fr;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.card-image{width:170px;aspect-ratio:360/499;border-radius:14px;border:1px solid var(--line2);background:#fff;overflow:hidden}.rank-badge{position:absolute;left:14px;top:14px;background:#ffffffec;border:1px solid var(--line2);color:var(--gold);font-size:13px;font-weight:800;padding:5px 9px;border-radius:10px}.card h3{margin:0 0 8px;font-size:24px;line-height:1.35}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.badge{font-size:13px;padding:5px 9px;border-radius:9px;background:var(--accentSoft);color:#48647f;font-weight:700}.badge.score-badge{background:#fff4d8;color:#8c6110}.label{font-size:12px;color:var(--accent);font-weight:800;margin-top:10px;letter-spacing:.04em}.axis{font-size:15px;font-weight:700;color:#35506c}.text{font-size:15px;color:#334458;margin-top:3px}.more{margin-top:14px;width:100%;border:1px solid var(--line2);background:#f6faff;color:#35506c;border-radius:12px;padding:10px;font-size:14px;font-weight:800;cursor:pointer}.ranking{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.rank-item{display:grid;grid-template-columns:54px 62px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}.rank-num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#f7fbff;border:1px solid var(--line2);color:var(--gold);font-weight:900;font-size:18px}.rank-thumb{width:56px;height:74px;border-radius:10px;border:1px solid var(--line2);overflow:hidden}.rank-name{font-size:15px;font-weight:800;line-height:1.35}.rank-meta{font-size:13px;color:var(--muted);margin-top:4px}.score{font-size:20px;font-weight:900;color:var(--gold);white-space:nowrap}.bottom-space{margin-top:44px}.rotation-section{margin-top:42px}.rotation-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);overflow:hidden}.rotation-image{display:block;width:100%;height:auto;aspect-ratio:1080/608;border-radius:14px;overflow:hidden;background:#0d1822}.empty{grid-column:1/-1;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:18px;padding:56px 16px}footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}dialog{width:min(900px,calc(100% - 24px));max-height:88vh;border:1px solid var(--line2);border-radius:24px;background:#fff;color:var(--text);padding:0;box-shadow:0 20px 70px rgba(42,65,94,.22)}dialog::backdrop{background:rgba(69,87,108,.24);backdrop-filter:blur(4px)}.modal{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px}.modal-image{width:260px;aspect-ratio:360/499;border-radius:16px;border:1px solid var(--line2);overflow:hidden}.modal h2{margin:0 0 6px;font-size:30px;line-height:1.3}.close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:0;border-radius:50%;background:#f0f6fd;color:#53708f;font-size:18px;cursor:pointer}.modal .block{margin-top:14px;padding:14px 15px;border:1px solid var(--line);background:var(--soft);border-radius:14px}.modal .block b{display:block;color:var(--accent);font-size:12px;margin-bottom:5px;letter-spacing:.04em}
@media(max-width:1150px){.grid{grid-template-columns:1fr}}@media(max-width:900px){.ranking{grid-template-columns:1fr}.modal{grid-template-columns:1fr}.modal-image{width:220px;margin:auto}.modal h2{text-align:center;padding-right:34px;font-size:25px}}@media(max-width:640px){body{font-size:15px}.wrap{padding:18px 14px 56px}.hero{padding-top:18px}.subtitle{font-size:15px}.controls-inner{padding:12px 14px}.toolbar{flex-direction:column}select{height:47px}.grid{grid-template-columns:1fr}.card{grid-template-columns:112px 1fr;gap:12px;padding:12px;border-radius:18px}.card-image{width:112px}.card h3{font-size:18px}.text,.axis{font-size:13px}.rank-item{grid-template-columns:44px 50px 1fr auto;padding:10px}.rank-thumb{width:48px;height:64px}.rank-name{font-size:13px}.rank-meta{font-size:11px}.score{font-size:16px}}
</style>
</head>
<body>
<div class="wrap"><header class="hero"><div class="eyebrow">SHADOWVERSE: WORLDS BEYOND</div><h1>新弾カードまとめ</h1><p class="subtitle">公開された新カードを、クラスごとに見やすく整理。カードを押すと、性能・強い使い方・どんな軸かを大きく確認できます。</p></header></div>
<div class="controls"><div class="controls-inner" id="filters"></div></div>
<div class="wrap" style="padding-top:0"><div class="section-title"><h2>カード一覧</h2><small id="resultText"></small></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="カード名・軸で検索"><select id="sort"><option value="rank">評価順</option><option value="cost">コスト順</option><option value="class">クラス順</option></select></div><main id="grid" class="grid"></main>
<section class="bottom-space"><div class="section-title"><h2>総合ランキング</h2><small>10点満点</small></div><div id="ranking" class="ranking"></div></section>
<section class="rotation-section"><div class="section-title"><div><h2>ローテ落ちカード一覧</h2><p class="rotation-note">新弾追加でローテーションから外れる「絶傑の継承者」のカード一覧</p></div></div><div class="rotation-card"><svg class="rotation-image" viewBox="0 1497 1080 608" role="img" aria-label="絶傑の継承者 ローテ落ちカード一覧"><image href="assets/cards-sprite.webp" x="0" y="0" width="1080" height="2105"/></svg></div></section>
<footer>※カード能力は公開時点の開発中情報をもとに整理しています。評価は現在判明しているカードとのシナジー、デッキ成立性、競技での再現性を含む暫定評価です。</footer></div>
<dialog id="dialog"><button class="close" aria-label="閉じる">×</button><div id="modalContent"></div></dialog>
<script>
const cards = [{"rank": 1, "name": "束刃の咎人・カットスロート", "class": "ネメシス", "cost": 2, "score": 9.6, "axis": "ハイランダー / 進化ネメシス", "performance": "2/2・必殺。進化時、デッキ内の同名カードをすべて消滅。その後、デッキに重複するカードがなければクレストを獲得。クレストは、自分がフォロワーをプレイしたとき、1ターンに1回そのフォロワーを進化させる。", "use": "カットスロートだけ複数枚採用し、進化時に残りを消してハイランダー条件を完成させる動きが強力。以後は毎ターン無料進化で進化回数・進化時能力・EP温存をまとめて稼ぐ。", "image": "01.jpg", "tag": "新軸の核", "sx": 0, "sy": 0}, {"rank": 2, "name": "渦潮の砲手", "class": "ロイヤル", "cost": 3, "score": 9.5, "axis": "海賊旗ロイヤル", "performance": "3/1・突進。ファンファーレで《戦慄の海賊旗》1枚を場に出し、《黄金の杯》1枚を手札に加える。", "use": "突進で盤面を処理しながら旗を設置。生成した《黄金の杯》をスペルとして使えば回復しつつ旗のカウントも進められ、1枚で新軸の準備が完結する。", "image": "02.jpg", "tag": "自己完結", "sx": 360, "sy": 0}, {"rank": 3, "name": "アージュドール", "class": "ロイヤル", "cost": 4, "score": 9.4, "axis": "海賊旗ロイヤル", "performance": "4コストスペル。《戦慄の海賊旗》1枚を場に出し、相手の場のフォロワーすべてに2ダメージ。エンハンス6なら旗2枚＋全体4ダメージ。", "use": "盤面をリセットしながら、後続のリーサル用に旗を残せる。6PPで旗2枚を置き、次のバルバロスで一気にカウントを進めてバーンを狙う。", "image": "03.jpg", "tag": "除去＋勝ち筋", "sx": 720, "sy": 0}, {"rank": 4, "name": "逆行の咎人・バルバロス", "class": "ロイヤル", "cost": 7, "score": 9.2, "axis": "海賊旗ロイヤル", "performance": "4/3・疾走。ファンファーレで《戦慄の海賊旗》1枚を場に出し、自分の場の《戦慄の海賊旗》すべてのカウントを-5する。", "use": "事前に置いた複数の旗をまとめて割り、旗のラストワード2点×枚数＋自身の4点疾走を同時に押し込む。新ロイヤルの明確なフィニッシャー候補。", "image": "04.jpg", "tag": "フィニッシャー", "sx": 0, "sy": 499}, {"rank": 5, "name": "万術の咎人・セフィー", "class": "ウィッチ", "cost": 7, "score": 9.1, "axis": "セフィー / 実験体ウィッチ", "performance": "4/4。融合時、2PPを消費して《没入の実験体》1体を場に出す。ファンファーレで実験体2体を出す。超進化時、毎ターン最初に場に出た実験体へ疾走を付与するクレストを獲得。", "use": "融合で実験体の登場回数を稼ぎ、5体条件を達成。以後は5/5化した実験体に疾走を付与し、盤面処理から継続打点へ切り替える。", "image": "05.jpg", "tag": "新ウィッチ軸", "sx": 360, "sy": 499}, {"rank": 6, "name": "錬磨の用心棒", "class": "ネメシス", "cost": 4, "score": 9.0, "axis": "ハイランダーネメシス", "performance": "4/4・守護。ファンファーレで、デッキに重複するカードがなければ相手の場のフォロワー1体に4ダメージを与え、自分のリーダーを4回復。", "use": "カットスロートの進化後に条件を満たして使うのが本命。4コストで除去・回復・守護を同時に行い、ハイランダーの中盤を大きく安定させる。", "image": "06.jpg", "tag": "中盤の要", "sx": 720, "sy": 499}, {"rank": 7, "name": "戦慄の海賊旗", "class": "ロイヤル", "cost": 1, "score": 8.8, "axis": "海賊旗ロイヤル（トークン）", "performance": "カウントダウン7。自分がスペルをプレイしたとき、このカウントを-1。ラストワードで相手リーダーに2ダメージ。", "use": "複数枚並べるほどスペル1枚でまとめてカウントが進む。アージュドールで増やし、バルバロスの-5で同時破壊して連続バーンへ変換する。", "image": "07.jpg", "tag": "バーンエンジン", "sx": 0, "sy": 998}, {"rank": 8, "name": "混迷の監獄・アズヴォルト", "class": "ニュートラル", "cost": 8, "score": 8.4, "axis": "コスト階段 / ハイランダー", "performance": "自分のターン終了時、このバトル中に元のコスト1〜8をすべてプレイしていれば破壊。ラストワードで、このバトル中に破壊された自分のフォロワーからランダム4種類を1体ずつ場に出し、自分の場のフォロワーすべてを+3/+3。", "use": "1〜7コストを事前に踏んでおき、8Tに自身で8コスト条件を埋めて即起動を狙う。コスト帯を散らすハイランダー構築の終盤フィニッシャー候補。", "image": "08.jpg", "tag": "専用構築", "sx": 360, "sy": 998}, {"rank": 9, "name": "没入の実験体", "class": "ウィッチ", "cost": 2, "score": 7.5, "axis": "セフィー / 実験体ウィッチ", "performance": "2/2・突進。これが場に出たとき、このバトル中に場に出た自分の他の《没入の実験体》が5枚以上なら+3/+3する。", "use": "序盤は2/2突進として盤面処理。6体目以降は5/5になり、セフィーのクレストがあれば毎ターン最初の1体を5/5疾走として運用できる。", "image": "09.jpg", "tag": "軸内評価 8.9", "sx": 720, "sy": 998}];
const classes=["全カード","エルフ","ロイヤル","ウィッチ","ドラゴン","ナイトメア","ビショップ","ネメシス","ニュートラル"];let activeClass="全カード";const ranking=document.querySelector("#ranking"),filters=document.querySelector("#filters"),grid=document.querySelector("#grid"),search=document.querySelector("#search"),sort=document.querySelector("#sort"),resultText=document.querySelector("#resultText"),dialog=document.querySelector("#dialog"),modalContent=document.querySelector("#modalContent");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function sprite(c,cls){return `<svg class="${cls}" viewBox="${c.sx} ${c.sy} 360 499" role="img" aria-label="${esc(c.name)}"><image href="assets/cards-sprite.webp" x="0" y="0" width="1080" height="2105"/></svg>`}
function renderRanking(){ranking.innerHTML=[...cards].sort((a,b)=>a.rank-b.rank).map(c=>`<div class="rank-item"><div class="rank-num">${c.rank}</div>${sprite(c,"rank-thumb")}<div><div class="rank-name">${esc(c.name)}</div><div class="rank-meta">${esc(c.class)} ・ ${c.cost}コスト ・ ${esc(c.axis)}</div></div><div class="score">${c.score.toFixed(1)}</div></div>`).join("")}
function renderFilters(){filters.innerHTML=classes.map(cls=>`<button class="filter ${cls===activeClass?'active':''}" data-class="${cls}">${cls}</button>`).join("");filters.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{activeClass=btn.dataset.class;renderFilters();renderCards()})}
function currentCards(){const q=search.value.trim().toLowerCase();let arr=cards.filter(c=>(activeClass==="全カード"||c.class===activeClass)&&(!q||[c.name,c.axis,c.class,c.tag].join(" ").toLowerCase().includes(q)));if(sort.value==="cost")arr.sort((a,b)=>a.cost-b.cost||a.rank-b.rank);else if(sort.value==="class")arr.sort((a,b)=>a.class.localeCompare(b.class,"ja")||a.rank-b.rank);else arr.sort((a,b)=>a.rank-b.rank);return arr}
function renderCards(){const arr=currentCards();resultText.textContent=`${arr.length}枚表示`;if(!arr.length){grid.innerHTML='<div class="empty">該当するカードはありません。</div>';return}grid.innerHTML=arr.map(c=>`<article class="card"><div class="rank-badge">#${c.rank}</div>${sprite(c,"card-image")}<div><h3>${esc(c.name)}</h3><div class="badges"><span class="badge">${esc(c.class)}</span><span class="badge">${c.cost}コスト</span><span class="badge score-badge">${c.score.toFixed(1)}/10</span></div><div class="label">どんな軸？</div><div class="axis">${esc(c.axis)}</div><div class="label">性能</div><div class="text">${esc(c.performance)}</div><div class="label">強い使い方</div><div class="text">${esc(c.use)}</div><button class="more" data-rank="${c.rank}">大きく見る</button></div></article>`).join("");grid.querySelectorAll(".more").forEach(b=>b.onclick=()=>openCard(+b.dataset.rank))}
function openCard(rank){const c=cards.find(x=>x.rank===rank);modalContent.innerHTML=`<div class="modal">${sprite(c,"modal-image")}<div><h2>${esc(c.name)}</h2><div class="badges"><span class="badge">#${c.rank}</span><span class="badge">${esc(c.class)}</span><span class="badge">${c.cost}コスト</span><span class="badge score-badge">${c.score.toFixed(1)}/10</span></div><div class="block"><b>どんな軸？</b>${esc(c.axis)}</div><div class="block"><b>性能</b>${esc(c.performance)}</div><div class="block"><b>強い使い方</b>${esc(c.use)}</div><div class="block"><b>評価ポイント</b>${esc(c.tag)}</div></div></div>`;dialog.showModal()}
dialog.querySelector(".close").onclick=()=>dialog.close();dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close()});search.addEventListener("input",renderCards);sort.addEventListener("change",renderCards);renderRanking();renderFilters();renderCards();
</script></body></html>
